<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1 Million Digits of Pi</title>
  <style>
    body { background-color: #f7f9fa; padding: 40px 20px; }
    #pi-display {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border: 1px solid #e1e4e6;
      border-radius: 6px;
      word-break: break-all;   /* Ensures wrapping */
      font-family: monospace;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="pi-display">Loading one million digits...</div>

  <script>
    // Fetches the text file and drops it into the box instantly
    fetch('pi.txt')
      .then(res => res.text())
      .then(data => document.getElementById('pi-display').textContent = data);
  </script>

</body>
</html>
